name: Manual Release

on:
  workflow_dispatch:
    inputs:
      bump:
        # The repo never carries the next version: the bump happens in
        # this run (package.json is patched, committed and tagged here).
        # "none" re-cuts the version package.json already has and is only
        # for rebuilding an existing release from its tag, so the gate
        # below refuses it on a version whose tag already exists. The
        # placeholder default forces an explicit choice.
        description: "Version bump (patch / minor / major; none = rebuild the current version from its tag)"
        required: true
        type: choice
        options:
          - choose
          - patch
          - minor
          - major
          - none
        default: "choose"

permissions:
  contents: write
  packages: write
  # Sigstore attestations for the binaries (attest-build-provenance) and
  # the image provenance/SBOM pushed by build-push-action.
  id-token: write
  attestations: write

jobs:
  # A manual dispatch has no `needs:` edge to the Tests / E2E workflows
  # (they trigger on push, this one on workflow_dispatch), so the gate
  # asks the API whether both already passed for the exact commit being
  # released. Re-run the red workflow and dispatch again if this fails.
  gate:
    name: Require green Tests + E2E on this commit
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Require an explicit bump that does not re-cut a released version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          set -e
          if [ "$BUMP" = "choose" ]; then
            echo "::error::Pick a version bump (patch / minor / major). 'none' only rebuilds the version package.json already has."
            exit 1
          fi
          if [ "$BUMP" = "none" ]; then
            version=$(jq -r .version package.json)
            if git ls-remote --exit-code --tags origin "refs/tags/v${version}" >/dev/null 2>&1 \
               && [ "$GITHUB_REF" != "refs/tags/v${version}" ]; then
              echo "::error::v${version} is already released; 'none' from ${GITHUB_REF} would overwrite its image, release assets and tag. Pick a bump, or dispatch on the v${version} tag to rebuild it."
              exit 1
            fi
          fi

      - name: Check workflow conclusions for ${{ github.sha }}
        run: |
          set -e
          failed=0
          for wf in test.yml e2e.yml; do
            conclusion=$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow "$wf" \
              --commit "$GITHUB_SHA" \
              --json status,conclusion \
              --jq '[.[] | select(.status == "completed")] | map(.conclusion) | if index("success") then "success" elif length == 0 then "missing" else .[0] end')
            echo "$wf: ${conclusion:-missing}"
            if [ "$conclusion" != "success" ]; then
              echo "::error::$wf has no successful run for $GITHUB_SHA (got '${conclusion:-missing}')"
              failed=1
            fi
          done
          exit $failed

  build-and-publish:
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Bun
        # Version comes from root package.json "packageManager".
        uses: oven-sh/setup-bun@v2

      - name: Read pinned bun version
        id: bun
        run: echo "version=$(jq -r '.packageManager | sub("^bun@"; "")' package.json)" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build app
        run: |
          cd apps/server
          bun run build --bump ${{ inputs.bump }}

      - name: Sync lockfile with bumped versions
        # bun.lock records workspace package versions, so the bump makes
        # it stale; refresh before the Docker build and bump commit.
        if: ${{ inputs.bump != 'none' }}
        run: bun install

      - name: Get new version
        id: get_version
        run: echo "version=$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"

      # Release notes are curated in RELEASE-NOTES-v<version>.md (repo
      # root) BEFORE dispatching. A bump without notes is an error; a
      # re-cut (bump=none) without notes only warns so a rebuild of an
      # existing version can still go out.
      - name: Assemble release body
        env:
          VERSION: ${{ steps.get_version.outputs.version }}
          BUMP: ${{ inputs.bump }}
        run: |
          set -e
          notes="RELEASE-NOTES-v${VERSION}.md"
          body="$RUNNER_TEMP/release-body.md"
          if [ -f "$notes" ]; then
            cat "$notes" > "$body"
            printf '\n' >> "$body"
          elif [ "$BUMP" != "none" ]; then
            echo "::error::$notes is missing — write the release notes before bumping to v${VERSION}"
            exit 1
          else
            echo "::warning::$notes is missing; the release body carries only the pull snippet"
            : > "$body"
          fi
          cat >> "$body" <<EOT
          ## Docker Image
          \`\`\`bash
          docker pull ghcr.io/${GITHUB_REPOSITORY}:v${VERSION}
          \`\`\`
          EOT
          echo "path=$body" >> "$GITHUB_OUTPUT"
        id: body

      - name: Write SHA256SUMS
        working-directory: apps/server/build/out
        run: |
          sha256sum pulse-linux-x64 pulse-linux-arm64 pulse-windows-x64.exe pulse-macos-arm64 release.json > SHA256SUMS
          cat SHA256SUMS

      - name: Attest binary provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            apps/server/build/out/pulse-linux-x64
            apps/server/build/out/pulse-linux-arm64
            apps/server/build/out/pulse-windows-x64.exe
            apps/server/build/out/pulse-macos-arm64

      - name: Identify user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Set up QEMU
        # Required so the amd64 GitHub runner can build linux/arm64
        # layers via emulation. Native arm64 runners would skip this.
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          # Multi-arch manifest. Apple Silicon / ARM Linux hosts pull
          # the arm64 layer natively; amd64 hosts pull amd64. The
          # Dockerfile branches on TARGETARCH to compile each binary.
          platforms: linux/amd64,linux/arm64
          push: true
          # Compile with the same bun CI tested (single source: package.json).
          build-args: |
            BUN_VERSION=${{ steps.bun.outputs.version }}
          # SLSA provenance + SPDX SBOM attached to the image index.
          provenance: true
          sbom: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:v${{ steps.get_version.outputs.version }}
          labels: |
            org.opencontainers.image.title=Pulse
            org.opencontainers.image.description=Pulse Server
            org.opencontainers.image.version=${{ steps.get_version.outputs.version }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.get_version.outputs.version }}
          name: v${{ steps.get_version.outputs.version }}
          draft: true
          body_path: ${{ steps.body.outputs.path }}
          files: |
            apps/server/build/out/pulse-linux-x64
            apps/server/build/out/pulse-linux-arm64
            apps/server/build/out/pulse-windows-x64.exe
            apps/server/build/out/pulse-macos-arm64
            apps/server/build/out/release.json
            apps/server/build/out/SHA256SUMS

      - name: Commit and push version bump
        if: ${{ inputs.bump != 'none' }}
        run: |
          git add package.json bun.lock apps/server/package.json apps/client/package.json packages/shared/package.json packages/plugin-sdk/package.json
          git commit -m "chore: bump version to ${{ steps.get_version.outputs.version }}"
          git push

      - name: Create Git tag
        run: |
          git tag -a "v${{ steps.get_version.outputs.version }}" -m "Release v${{ steps.get_version.outputs.version }}"
          git push origin "v${{ steps.get_version.outputs.version }}"
