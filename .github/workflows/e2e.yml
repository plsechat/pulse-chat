name: E2E

on:
  push:
    branches: [dev, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Build the harness image once with layer caching — bun install +
      # vite build dominate; warm cache turns ~5 min into ~1 min.
      - name: Build pulse-e2e image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: e2e/docker/Dockerfile
          tags: pulse-e2e:latest
          load: true
          cache-from: type=gha,scope=e2e
          cache-to: type=gha,scope=e2e,mode=max

      - name: Start instances
        run: docker compose -f e2e/docker/compose.yml up -d --wait --no-build

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Wait for instances
        run: |
          for port in 14991 14993 14994 14995; do
            for i in $(seq 1 60); do
              if curl -sf "http://127.0.0.1:${port}/info" > /dev/null; then
                echo "port ${port} ready"; break
              fi
              [ "$i" = "60" ] && { echo "port ${port} never became ready" >&2; exit 1; }
              sleep 2
            done
          done

      - name: Run E2E suite
        working-directory: e2e
        run: npx playwright test

      - name: Dump instance logs on failure
        if: failure()
        run: docker compose -f e2e/docker/compose.yml logs --tail 200

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7
