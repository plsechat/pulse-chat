name: E2E Upgrade

# Upgrade smoke: the previously PUBLISHED release image seeds a data
# volume through the real client, the image built from this checkout
# starts on the same volume, and verify.spec.ts asserts the operator's
# expectations (login, channel, message, upload, /healthz, every
# migration applied exactly once). See e2e/docker/upgrade-smoke.sh.
#
# Nightly against dev (the branch the next release is cut from), or on
# demand from any branch with a chosen source tag.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      old_tag:
        description: "Published image tag to upgrade FROM (ghcr.io/<repo>:<tag>)"
        required: false
        default: "latest"
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: e2e-upgrade-${{ github.ref }}
  cancel-in-progress: true

jobs:
  upgrade:
    name: Upgrade smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OLD_IMAGE: ghcr.io/${{ github.repository }}:${{ inputs.old_tag || 'latest' }}
      NEW_IMAGE: pulse-e2e:upgrade-new
    steps:
      - uses: actions/checkout@v4
        with:
          # A schedule fires on the default branch; the upgrade that
          # matters is release -> the next release candidate, so the
          # nightly checks out dev. A dispatch tests the branch it was
          # started from.
          ref: ${{ github.event_name == 'schedule' && 'dev' || github.ref }}

      - uses: docker/setup-buildx-action@v3

      - name: Read pinned bun version
        id: bun
        run: echo "version=$(jq -r '.packageManager | sub("^bun@"; "")' package.json)" >> "$GITHUB_OUTPUT"

      # Same harness image and layer cache as e2e.yml (scope=e2e), so the
      # nightly rides the cache the push-time run keeps warm.
      - name: Build the candidate image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: e2e/docker/Dockerfile
          tags: ${{ env.NEW_IMAGE }}
          build-args: |
            BUN_VERSION=${{ steps.bun.outputs.version }}
          load: true
          cache-from: type=gha,scope=e2e
          cache-to: type=gha,scope=e2e,mode=max

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull the previous release image
        run: |
          docker pull "$OLD_IMAGE"
          echo "old image version label: $(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.version" }}' "$OLD_IMAGE")"
          echo "candidate version: $(jq -r .version apps/server/package.json)"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Seed on the old image, swap, verify on the new one
        run: bash e2e/docker/upgrade-smoke.sh "$OLD_IMAGE" "$NEW_IMAGE"

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-upgrade-report
          path: |
            e2e/playwright-report
            e2e/test-results
            e2e/.upgrade
          retention-days: 7
