name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

# The bun version comes from root package.json "packageManager" —
# oven-sh/setup-bun@v2 reads it when bun-version is omitted, so there is
# exactly one place to bump it (the Dockerfiles take it as a build-arg).

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check types
        run: bun run check-types

      - name: Lint
        run: bun run lint

      # Dead files / exports / dependencies fail the build. knip.json lists
      # the non-import entry points (bun:test preloads, CLI scripts).
      - name: Dead code (knip)
        run: bun run knip

  # The client's bun:test suite needs no Postgres: happy-dom + the
  # fake-indexeddb shim come from apps/client/bunfig.toml's preload.
  client-tests:
    name: Client unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run client tests
        working-directory: apps/client
        # Same discipline as the server shards: a non-zero exit OR any
        # `(fail)` line marks the run failed. Bun logs hook-level failures
        # as `(fail)` without bumping the fail count or the exit code, so
        # the exit code alone is not trusted. Output is never truncated.
        run: |
          set -e
          output_file=$(mktemp)
          set +e
          bun run test 2>&1 | tee "$output_file"
          bun_exit=${PIPESTATUS[0]}
          set -e
          if [ "$bun_exit" -ne 0 ] || grep -qE '^\(fail\)' "$output_file"; then
            echo "::error::client unit tests failed (bun exit=$bun_exit)"
            rm -f "$output_file"
            exit 1
          fi
          rm -f "$output_file"

  # The official bridge plugin's own bun:test suite (recorded fixtures,
  # no Postgres, no network). Same (fail)-line discipline as the client.
  plugin-tests:
    name: Plugin unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run bridge plugin tests
        working-directory: packages/plugins/discord-bridge
        run: |
          set -e
          output_file=$(mktemp)
          set +e
          bun test src 2>&1 | tee "$output_file"
          bun_exit=${PIPESTATUS[0]}
          set -e
          if [ "$bun_exit" -ne 0 ] || grep -qE '^\(fail\)' "$output_file"; then
            echo "::error::plugin unit tests failed (bun exit=$bun_exit)"
            rm -f "$output_file"
            exit 1
          fi
          rm -f "$output_file"

  # Production build + bundle size gate. The app once shipped as a
  # single 5.4 MB chunk; the budgets in scripts/check-bundle-size.ts
  # (largest chunk, initial JavaScript) fail the PR that drags a lazy
  # screen or a vendor library back into the first paint.
  client-build:
    name: Client build & bundle size
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build client
        working-directory: apps/client
        run: bun run build

      - name: Bundle size gate
        working-directory: apps/client
        run: bun run check-bundle-size

  # Catch non-idempotent migrations at PR time. Drizzle's migration
  # tracking is kept, so in production each migration runs once — but
  # the house rule is that every committed SQL file must also be
  # replay-safe (IF NOT EXISTS / DO $$ guards), because a crashed or
  # partially applied upgrade is recovered by re-running the folder.
  # CI's fresh Postgres never exercises that rerun path on its own, so
  # this job applies every migration twice against a clean DB; the
  # second pass explodes if anything regressed (PR #73's
  # 0016_huge_prodigy.sql shipped with the wrong EXCEPTION class and
  # crashed a production boot; this job would have flagged it pre-merge).
  migrations-idempotent:
    name: Migrations replay-safe
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pulse_test
          POSTGRES_PASSWORD: pulse_test
          POSTGRES_DB: pulse_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pulse_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://pulse_test:pulse_test@localhost:5432/pulse_test

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Wait for PostgreSQL
        run: |
          for i in $(seq 1 30); do
            pg_isready -h localhost -p 5432 -U pulse_test && break
            echo "Waiting for postgres ($i/30)..."
            sleep 2
          done

      # Regenerate from schema.ts, then refuse any drift: a migration that
      # db:gen produces here but nobody committed (and hand-patched
      # idempotent) must fail the PR instead of silently passing.
      - name: Generate Drizzle migrations
        working-directory: apps/server
        run: bun run db:gen

      - name: Fail on uncommitted migration drift
        working-directory: apps/server
        run: |
          if [ -n "$(git status --porcelain -- src/db/migrations)" ]; then
            echo "::error::schema.ts drifted from the committed migrations — run 'bun run db:gen' in apps/server, hand-patch the SQL idempotent, and commit it"
            git status --porcelain -- src/db/migrations
            git diff -- src/db/migrations
            exit 1
          fi

      - name: Apply migrations twice
        working-directory: apps/server
        run: bun run src/scripts/check-migrations-idempotent.ts

  # Find every server test file and split into 10 roughly-even
  # chunks. Each chunk becomes a single test job, so a freshly
  # provisioned VM + postgres + bun install + drizzle gen amortises
  # over ~5-6 test files instead of running once per file. New
  # tests get picked up automatically — the chunking is dynamic.
  discover-tests:
    name: Discover test files
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.find.outputs.shards }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - id: find
        name: Enumerate + chunk test files
        working-directory: apps/server
        run: |
          shards_count=10
          files_json=$(find src -name '*.test.ts' -type f \
            | sort \
            | jq -R -s -c 'split("\n") | map(select(length > 0))')
          total=$(echo "$files_json" | jq 'length')
          if [ "$total" -eq 0 ]; then
            echo "shards=[]" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Ceil(total / shards) so the last chunk doesn't overflow.
          chunk_size=$(( (total + shards_count - 1) / shards_count ))
          shards=$(echo "$files_json" | jq -c "
            [range(0; length; $chunk_size) as \$i | .[\$i : \$i + $chunk_size]]
          ")
          echo "shards=$shards" >> "$GITHUB_OUTPUT"
          echo "Split $total test files into $(echo "$shards" | jq 'length') shards:"
          echo "$shards" | jq -c '.[]'

  # Each shard is an array of file paths handed to
  # apps/server/scripts/test-per-file.sh, which runs every file in its
  # own `bun test` process. Bun runs the files of one invocation
  # sequentially inside a single process, but `mock.module` is
  # process-global: a mock installed by one file leaks into the next,
  # so per-file processes are the isolation boundary. The script is
  # also what developers run locally, so CI and local share one path.
  test:
    name: Test shard ${{ strategy.job-index }}
    needs: discover-tests
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.discover-tests.outputs.shards) }}

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pulse_test
          POSTGRES_PASSWORD: pulse_test
          POSTGRES_DB: pulse_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pulse_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://pulse_test:pulse_test@localhost:5432/pulse_test

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Wait for PostgreSQL
        run: |
          for i in $(seq 1 30); do
            pg_isready -h localhost -p 5432 -U pulse_test && break
            echo "Waiting for postgres ($i/30)..."
            sleep 2
          done

      - name: Generate Drizzle migrations
        working-directory: apps/server
        run: bun run db:gen

      - name: Fail on uncommitted migration drift
        working-directory: apps/server
        run: |
          if [ -n "$(git status --porcelain -- src/db/migrations)" ]; then
            echo "::error::schema.ts drifted from the committed migrations — run 'bun run db:gen' in apps/server, hand-patch the SQL idempotent, and commit it"
            git status --porcelain -- src/db/migrations
            git diff -- src/db/migrations
            exit 1
          fi

      # test-per-file.sh owns the failure discipline: each file runs with
      # --timeout 15000, and a non-zero bun exit OR any `(fail)` line in
      # the untruncated output fails the shard (bun logs hook timeouts as
      # `(fail)` while still exiting 0). Never trust the exit code alone.
      - name: Run shard
        working-directory: apps/server
        run: bash scripts/test-per-file.sh ${{ join(matrix.shard, ' ') }}
